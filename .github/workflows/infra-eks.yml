name: Infra — Terraform (EKS + RDS + Redis + ECR)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_WORKING_DIR: EKS-Terraform
  BUCKET_NAME: venus-hospital-tfstate-vkb   # must match backend.tf

# ---------------------------------------------------------------------
# AUTH MODE: ACCESS KEY (active) — AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# repo secrets, used in the "Configure AWS Credentials" steps below.
#
# AUTH MODE: OIDC (commented out). To switch: uncomment the permissions
# block below AND the role-to-assume line in both "Configure AWS
# Credentials" steps, and comment out their access-key lines instead.
# ---------------------------------------------------------------------
# permissions:
#   id-token: write
#   contents: read

jobs:
  # ============================================================
  # TERRAFORM PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ---- ACCESS KEY (active) ----
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # ---- OIDC (commented out) — see the note above jobs: ----
          # role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # State bucket has to exist before `terraform init` can use it.
      - name: Create S3 state bucket if missing
        run: |
          if aws s3api head-bucket --bucket "${{ env.BUCKET_NAME }}" 2>/dev/null; then
            echo "Bucket already exists. Skipping creation."
          else
            echo "Creating state bucket..."
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${{ env.BUCKET_NAME }}" --region us-east-1
            else
              aws s3api create-bucket --bucket "${{ env.BUCKET_NAME }}" \
                --region "${{ env.AWS_REGION }}" \
                --create-bucket-configuration LocationConstraint="${{ env.AWS_REGION }}"
            fi
            aws s3api put-bucket-versioning --bucket "${{ env.BUCKET_NAME }}" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "${{ env.BUCKET_NAME }}" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "Bucket created."
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  # ============================================================
  # TERRAFORM APPLY  (gated by the `production` environment)
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    # Add a required reviewer to this environment in repo Settings so
    # nobody can destroy the cluster without a second pair of eyes.
    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # ---- ACCESS KEY (active) ----
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # ---- OIDC (commented out) — see the note above jobs: ----
          # role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Copy rds_endpoint into k8s-base/02-app-secret.yml (DB_HOST)"
          echo "Copy redis_endpoint into k8s-base/01-app-config.yml (REDIS_HOST / REDIS_URL)"
