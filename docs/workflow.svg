<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="1160" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .tw  { font-size: 13px; fill: #ffffff; font-weight: 600; }
      .ts  { font-size: 11px; fill: #475569; }
      .lbl { font-size: 11px; fill: #94a3b8; font-weight: 600; letter-spacing: .5px; }
      .ln  { stroke: #64748b; stroke-width: 1.8; marker-end: url(#a2); fill: none; }
      .zone{ fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .step{ font-size: 12px; fill: #0f172a; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1160" height="720" fill="#f8fafc"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0f172a">Venus Hospital — CI/CD &amp; Deployment Workflow</text>
  <text x="32" y="62" class="ts">Two GitHub Actions workflows · ECR · ArgoCD GitOps</text>

  <!-- PIPELINE 1: INFRA -->
  <rect x="32" y="86" width="1096" height="170" class="zone" stroke="#8b5cf6"/>
  <text x="46" y="106" class="lbl" fill="#8b5cf6">WORKFLOW 1 — infra-eks.yml  (manual dispatch, runs once)</text>

  <rect x="56" y="124" width="150" height="58" rx="8" fill="#6d28d9"/>
  <text x="131" y="148" class="tw" text-anchor="middle" font-size="12">Run workflow</text>
  <text x="131" y="166" font-size="10" fill="#ddd6fe" text-anchor="middle">apply | destroy</text>

  <rect x="236" y="124" width="150" height="58" rx="8" fill="#7c3aed"/>
  <text x="311" y="148" class="tw" text-anchor="middle" font-size="12">terraform plan</text>
  <text x="311" y="166" font-size="10" fill="#ddd6fe" text-anchor="middle">+ validate, fmt</text>

  <rect x="416" y="124" width="170" height="58" rx="8" fill="#dc2626"/>
  <text x="501" y="148" class="tw" text-anchor="middle" font-size="12">Approval gate</text>
  <text x="501" y="166" font-size="10" fill="#fecaca" text-anchor="middle">environment: production</text>

  <rect x="616" y="124" width="150" height="58" rx="8" fill="#7c3aed"/>
  <text x="691" y="148" class="tw" text-anchor="middle" font-size="12">terraform apply</text>
  <text x="691" y="166" font-size="10" fill="#ddd6fe" text-anchor="middle">~15–20 min</text>

  <rect x="796" y="118" width="310" height="70" rx="8" fill="#334155"/>
  <text x="951" y="140" class="tw" text-anchor="middle" font-size="12">Provisioned</text>
  <text x="951" y="158" font-size="10" fill="#cbd5e1" text-anchor="middle">VPC · EKS + nodegroup · addons · bastion</text>
  <text x="951" y="174" font-size="10" fill="#94a3b8" text-anchor="middle">RDS · ElastiCache · 6 ECR repos</text>

  <line x1="206" y1="153" x2="232" y2="153" class="ln"/>
  <line x1="386" y1="153" x2="412" y2="153" class="ln"/>
  <line x1="586" y1="153" x2="612" y2="153" class="ln"/>
  <line x1="766" y1="153" x2="792" y2="153" class="ln"/>

  <!-- PIPELINE 2: APP -->
  <rect x="32" y="276" width="1096" height="196" class="zone" stroke="#0891b2"/>
  <text x="46" y="296" class="lbl" fill="#0891b2">WORKFLOW 2 — application-build.yml  (every code change)</text>

  <rect x="56" y="316" width="140" height="58" rx="8" fill="#0e7490"/>
  <text x="126" y="340" class="tw" text-anchor="middle" font-size="12">git push</text>
  <text x="126" y="358" font-size="10" fill="#cffafe" text-anchor="middle">main branch</text>

  <rect x="226" y="304" width="230" height="82" rx="8" fill="#0891b2"/>
  <text x="341" y="326" class="tw" text-anchor="middle" font-size="12">Build matrix ×6</text>
  <text x="341" y="344" font-size="10" fill="#cffafe" text-anchor="middle">5 Flask services + Streamlit</text>
  <text x="341" y="360" font-size="10" fill="#a5f3fc" text-anchor="middle">context = repo root (needs common/)</text>
  <text x="341" y="376" font-size="10" fill="#a5f3fc" text-anchor="middle">buildx cache, fail-fast: false</text>

  <rect x="486" y="304" width="200" height="82" rx="8" fill="#334155"/>
  <text x="586" y="330" class="tw" text-anchor="middle" font-size="12">Push to ECR</text>
  <text x="586" y="350" font-size="10" fill="#cbd5e1" text-anchor="middle">tag :&lt;git-sha&gt;</text>
  <text x="586" y="366" font-size="10" fill="#94a3b8" text-anchor="middle">tag :latest</text>

  <rect x="716" y="304" width="230" height="82" rx="8" fill="#0e7490"/>
  <text x="831" y="326" class="tw" text-anchor="middle" font-size="12">commit-manifests job</text>
  <text x="831" y="344" font-size="10" fill="#cffafe" text-anchor="middle">collects 6 artifacts</text>
  <text x="831" y="360" font-size="10" fill="#a5f3fc" text-anchor="middle">pins image: tags, ONE commit</text>
  <text x="831" y="376" font-size="10" fill="#a5f3fc" text-anchor="middle">avoids push races</text>

  <rect x="976" y="316" width="130" height="58" rx="8" fill="#16a34a"/>
  <text x="1041" y="340" class="tw" text-anchor="middle" font-size="12">ArgoCD</text>
  <text x="1041" y="358" font-size="10" fill="#dcfce7" text-anchor="middle">auto-sync</text>

  <line x1="196" y1="345" x2="222" y2="345" class="ln"/>
  <line x1="456" y1="345" x2="482" y2="345" class="ln"/>
  <line x1="686" y1="345" x2="712" y2="345" class="ln"/>
  <line x1="946" y1="345" x2="972" y2="345" class="ln"/>

  <path d="M1041 374 L1041 410 L341 410 L341 390" class="ln" stroke-dasharray="4 3"/>
  <text x="690" y="426" class="ts" text-anchor="middle" font-size="10">[skip ci] prevents the tag commit from re-triggering the build</text>

  <!-- MANUAL SEQUENCE -->
  <rect x="32" y="492" width="1096" height="200" class="zone" stroke="#f59e0b"/>
  <text x="46" y="512" class="lbl" fill="#d97706">ONE-TIME CLUSTER BOOTSTRAP — order matters</text>

  <g font-size="11">
    <circle cx="86" cy="552" r="15" fill="#475569"/><text x="86" y="557" class="num" text-anchor="middle">1</text>
    <text x="110" y="549" class="step">db/init.sql on RDS</text>
    <text x="110" y="565" class="ts" font-size="10">from bastion — RDS is private</text>

    <circle cx="316" cy="552" r="15" fill="#475569"/><text x="316" y="557" class="num" text-anchor="middle">2</text>
    <text x="340" y="549" class="step">ingress-nginx</text>
    <text x="340" y="565" class="ts" font-size="10">creates the public NLB</text>

    <circle cx="546" cy="552" r="15" fill="#475569"/><text x="546" y="557" class="num" text-anchor="middle">3</text>
    <text x="570" y="549" class="step">k8s-base/</text>
    <text x="570" y="565" class="ts" font-size="10">ns, SC, ConfigMap only — no Secret</text>

    <circle cx="836" cy="552" r="15" fill="#475569"/><text x="836" y="557" class="num" text-anchor="middle">4</text>
    <text x="860" y="549" class="step">services + frontend</text>
    <text x="860" y="565" class="ts" font-size="10">nothing stateful to wait on first</text>

    <circle cx="86" cy="628" r="15" fill="#475569"/><text x="86" y="633" class="num" text-anchor="middle">5</text>
    <text x="110" y="625" class="step">ingress.yml</text>
    <text x="110" y="641" class="ts" font-size="10">websocket + cookie affinity</text>

    <circle cx="316" cy="628" r="15" fill="#475569"/><text x="316" y="633" class="num" text-anchor="middle">6</text>
    <text x="340" y="625" class="step">efk-stack/</text>
    <text x="340" y="641" class="ts" font-size="10">Kibana gets a LoadBalancer</text>

    <circle cx="546" cy="628" r="15" fill="#475569"/><text x="546" y="633" class="num" text-anchor="middle">7</text>
    <text x="570" y="625" class="step">Prometheus + Grafana</text>
    <text x="570" y="641" class="ts" font-size="10">helm kube-prometheus-stack</text>

    <circle cx="836" cy="628" r="15" fill="#16a34a"/><text x="836" y="633" class="num" text-anchor="middle">8</text>
    <text x="860" y="625" class="step">ArgoCD + k8s-argocd/</text>
    <text x="860" y="641" class="ts" font-size="10">after this, stop using kubectl apply</text>
  </g>

  <text x="32" y="710" class="ts" font-size="10">Teardown: delete k8s LoadBalancers BEFORE terraform destroy — orphaned NLB ENIs block VPC deletion.</text>
</svg>
