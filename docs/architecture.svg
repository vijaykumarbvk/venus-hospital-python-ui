<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .t   { font-size: 13px; fill: #0f172a; }
      .ts  { font-size: 11px; fill: #475569; }
      .tw  { font-size: 13px; fill: #ffffff; font-weight: 600; }
      .th  { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .zone{ fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
      .lbl { font-size: 11px; fill: #94a3b8; font-weight: 600; letter-spacing: .5px; }
      .ln  { stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect width="1160" height="780" fill="#f8fafc"/>
  <text x="32" y="40" class="th" font-size="20">Venus Hospital — Runtime Architecture on AWS EKS</text>
  <text x="32" y="62" class="ts">5 Flask microservices + Streamlit UI · RDS MySQL · ElastiCache Redis (cache + rate limit + event bus)</text>

  <!-- Internet -->
  <rect x="470" y="86" width="220" height="42" rx="8" fill="#0f172a"/>
  <text x="580" y="113" class="tw" text-anchor="middle">Internet / Browser</text>
  <line x1="580" y1="128" x2="580" y2="158" class="ln"/>

  <!-- VPC zone -->
  <rect x="32" y="158" width="1096" height="592" class="zone"/>
  <text x="46" y="178" class="lbl">AWS VPC 10.0.0.0/16 · us-east-1</text>

  <!-- NLB -->
  <rect x="440" y="196" width="280" height="44" rx="8" fill="#ea580c"/>
  <text x="580" y="223" class="tw" text-anchor="middle">AWS NLB (created by ingress-nginx)</text>
  <line x1="580" y1="240" x2="580" y2="268" class="ln"/>

  <!-- EKS zone -->
  <rect x="52" y="268" width="800" height="412" class="zone" stroke="#60a5fa"/>
  <text x="66" y="288" class="lbl" fill="#3b82f6">EKS CLUSTER — private subnets (2 AZ)</text>

  <!-- ingress -->
  <rect x="300" y="300" width="300" height="52" rx="8" fill="#2563eb"/>
  <text x="450" y="321" class="tw" text-anchor="middle">Ingress-NGINX</text>
  <text x="450" y="340" font-size="11" fill="#dbeafe" text-anchor="middle">/ → Streamlit  ·  /api → Gateway</text>

  <line x1="380" y1="352" x2="220" y2="392" class="ln"/>
  <line x1="520" y1="352" x2="620" y2="392" class="ln"/>

  <!-- Streamlit -->
  <rect x="86" y="392" width="268" height="66" rx="8" fill="#7c3aed"/>
  <text x="220" y="417" class="tw" text-anchor="middle">streamlit-frontend  ×2</text>
  <text x="220" y="435" font-size="11" fill="#ede9fe" text-anchor="middle">:8501 · websocket + cookie affinity</text>
  <text x="220" y="450" font-size="10" fill="#ddd6fe" text-anchor="middle">session state in pod memory</text>

  <!-- Gateway -->
  <rect x="520" y="392" width="300" height="66" rx="8" fill="#0891b2"/>
  <text x="670" y="414" class="tw" text-anchor="middle">api-gateway  ×2</text>
  <text x="670" y="431" font-size="11" fill="#cffafe" text-anchor="middle">JWT validate · rate limit · circuit break</text>
  <text x="670" y="447" font-size="10" fill="#a5f3fc" text-anchor="middle">injects X-User-Id / X-User-Role</text>

  <!-- Streamlit -> gateway (in-cluster) -->
  <path d="M354 425 L520 425" class="ln"/>
  <text x="437" y="419" class="ts" text-anchor="middle" font-size="10">API_BASE_URL</text>

  <!-- fan out -->
  <line x1="600" y1="458" x2="160" y2="516" class="ln"/>
  <line x1="640" y1="458" x2="350" y2="516" class="ln"/>
  <line x1="700" y1="458" x2="540" y2="516" class="ln"/>
  <line x1="740" y1="458" x2="730" y2="516" class="ln"/>

  <!-- services -->
  <rect x="72" y="516" width="176" height="62" rx="8" fill="#059669"/>
  <text x="160" y="540" class="tw" text-anchor="middle" font-size="12">user-service ×2</text>
  <text x="160" y="557" font-size="10" fill="#d1fae5" text-anchor="middle">issues JWT</text>
  <text x="160" y="571" font-size="10" fill="#a7f3d0" text-anchor="middle">venus_user_db</text>

  <rect x="262" y="516" width="176" height="62" rx="8" fill="#059669"/>
  <text x="350" y="540" class="tw" text-anchor="middle" font-size="12">doctor-service ×2</text>
  <text x="350" y="557" font-size="10" fill="#d1fae5" text-anchor="middle">Redis cache 180s</text>
  <text x="350" y="571" font-size="10" fill="#a7f3d0" text-anchor="middle">venus_doctor_db</text>

  <rect x="452" y="516" width="176" height="62" rx="8" fill="#059669"/>
  <text x="540" y="540" class="tw" text-anchor="middle" font-size="12">patient-service ×2</text>
  <text x="540" y="557" font-size="10" fill="#d1fae5" text-anchor="middle">age / BMI computed</text>
  <text x="540" y="571" font-size="10" fill="#a7f3d0" text-anchor="middle">venus_patient_db</text>

  <rect x="642" y="516" width="190" height="62" rx="8" fill="#059669"/>
  <text x="737" y="540" class="tw" text-anchor="middle" font-size="12">appointment-service ×2</text>
  <text x="737" y="557" font-size="10" fill="#d1fae5" text-anchor="middle">slot conflict rules</text>
  <text x="737" y="571" font-size="10" fill="#a7f3d0" text-anchor="middle">venus_appointment_db</text>

  <!-- doctor/patient -> user (enrichment, breaker) -->
  <path d="M262 547 L248 547" class="ln"/>
  <text x="255" y="596" class="ts" text-anchor="middle" font-size="9">enrich via user-service</text>
  <text x="255" y="607" class="ts" text-anchor="middle" font-size="9">(circuit-breaker + fallback)</text>

  <!-- Event bus note (was a separate Kafka+Zookeeper box; now rides on
       the same ElastiCache Redis box shown in the MANAGED column) -->
  <rect x="72" y="628" width="300" height="40" rx="8" fill="#1e293b"/>
  <text x="222" y="647" class="tw" text-anchor="middle" font-size="11">Event bus: Redis Streams</text>
  <text x="222" y="661" font-size="9" fill="#94a3b8" text-anchor="middle">(same ElastiCache Redis, no separate broker)</text>
  <path d="M700 578 L700 602 L300 602 L300 624" class="ln"/>
  <line x1="160" y1="578" x2="160" y2="624" class="ln"/>

  <!-- Managed data zone -->
  <rect x="872" y="268" width="240" height="412" class="zone" stroke="#f59e0b"/>
  <text x="886" y="288" class="lbl" fill="#d97706">MANAGED · private subnets</text>

  <rect x="892" y="308" width="200" height="74" rx="8" fill="#b45309"/>
  <text x="992" y="333" class="tw" text-anchor="middle">RDS MySQL 8.0</text>
  <text x="992" y="351" font-size="10" fill="#fed7aa" text-anchor="middle">4 schemas, one per service</text>
  <text x="992" y="366" font-size="10" fill="#fde68a" text-anchor="middle">not publicly accessible</text>

  <rect x="892" y="400" width="200" height="74" rx="8" fill="#b91c1c"/>
  <text x="992" y="425" class="tw" text-anchor="middle">ElastiCache Redis</text>
  <text x="992" y="443" font-size="10" fill="#fecaca" text-anchor="middle">@cached decorators</text>
  <text x="992" y="458" font-size="10" fill="#fca5a5" text-anchor="middle">Flask-Limiter counters</text>

  <rect x="892" y="492" width="200" height="74" rx="8" fill="#334155"/>
  <text x="992" y="517" class="tw" text-anchor="middle">ECR</text>
  <text x="992" y="535" font-size="10" fill="#cbd5e1" text-anchor="middle">6 repos · scan on push</text>
  <text x="992" y="550" font-size="10" fill="#94a3b8" text-anchor="middle">keep last 10 images</text>

  <rect x="892" y="584" width="200" height="74" rx="8" fill="#475569"/>
  <text x="992" y="609" class="tw" text-anchor="middle">Bastion (EC2)</text>
  <text x="992" y="627" font-size="10" fill="#cbd5e1" text-anchor="middle">kubectl · helm · eksctl</text>
  <text x="992" y="642" font-size="10" fill="#94a3b8" text-anchor="middle">mysql client for db/init.sql</text>

  <path d="M832 547 L892 470" class="ln"/>
  <path d="M832 540 L892 350" class="ln"/>
  <path d="M820 425 L892 430" class="ln"/>

  <!-- observability footnote -->
  <rect x="392" y="628" width="440" height="40" rx="8" fill="#0f766e"/>
  <text x="612" y="653" class="tw" text-anchor="middle" font-size="12">EFK (kube-logging) · Prometheus + Grafana · ArgoCD</text>

  <text x="32" y="768" class="ts" font-size="10">Every service reads config from env only — one ConfigMap (venus-config) mounted via envFrom. No k8s Secret object.</text>
</svg>
