apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: venus
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
        - name: api-gateway
          image: 633379283316.dkr.ecr.us-east-1.amazonaws.com/venus-api-gateway:221761e4427735253ccea9e43cda69105d74e4a9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # The gateway owns no database — it only needs the downstream
          # service URLs, the Redis URL for rate limiting, and JWT_SECRET
          # so it can validate tokens before proxying. All of that (plus
          # DB creds for the other services) lives in one ConfigMap — no
          # k8s Secret object in this project, matching the previous
          # project's plaintext-ConfigMap pattern.
          envFrom:
            - configMapRef:
                name: venus-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: venus
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
