apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: venus
  labels:
    app: patient-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
        tier: backend
    spec:
      containers:
        - name: patient-service
          image: 633379283316.dkr.ecr.us-east-1.amazonaws.com/venus-patient-service:221761e4427735253ccea9e43cda69105d74e4a9
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: venus-config
          env:
            - name: DB_NAME
              value: "venus_patient_db"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: venus
  labels:
    app: patient-service
spec:
  type: ClusterIP
  selector:
    app: patient-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
